<main class="min-h-dvh bg-canvas px-6 py-16 text-ink">
  <div class="mx-auto max-w-2xl">
    <p class="text-sm font-medium uppercase tracking-[0.14em] text-brand">
      {{ 'app.brand' | transloco }}
    </p>
    <h1 class="mt-3 text-4xl font-bold tracking-tight text-ink-heading">
      {{ 'app.tagline' | transloco }}
    </h1>
    <p class="mt-4 max-w-xl text-base leading-relaxed text-ink-muted">
      {{ 'app.hint' | transloco }}
    </p>
    <div class="mt-8 h-1 w-24 rounded-full bg-brand" aria-hidden="true"></div>
  </div>
</main>
